spring.application.name=wsr_biblioteca
server.servlet.context-path=/biblioteca/service/api
server.port=8081
# =============================================================
# Variables de entorno (.env) — ver .env.example
# =============================================================
spring.config.import=optional:file:.env[.properties]
# =============================================================
# Jackson — Zona horaria y formato de fechas
# =============================================================
spring.jackson.time-zone=America/Lima
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.deserialization.fail-on-null-for-primitives=false
# =============================================================
# SQL Init
# =============================================================
spring.sql.init.mode=never
# =============================================================
# DATASOURCE — Oracle DEV
# =============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# =============================================================
# JPA / HIBERNATE
# =============================================================
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# =============================================================
# HIKARI — Pool de conexiones
# =============================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1 FROM DUAL
# =============================================================
# Spring Boot Actuator
# =============================================================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=wsr_biblioteca
info.app.version=0.0.1
info.app.description=API REST Biblioteca
# =============================================================
# Swagger / OpenAPI
# =============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.packages-to-scan=com.jhontruse.biblioteca.controller
springdoc.paths-to-match=/**
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
# =============================================================
# CORS
# =============================================================
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
# =============================================================
# Logging
# =============================================================
logging.level.root=INFO
logging.level.com.jhontruse.wsrfastfood=DEBUG
logging.level.org.springframework.jdbc.core=INFO
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [TRACE= %X{traceId}] [%X{method}] [%X{endpoint}] [STATUS= %X{status}] [DURATION= %X{duration}] %-5level [%thread] %logger{36} - %msg%n
